# A plain Seeed Studio XIAO ESP32-S3 with nothing attached. It reports its chip
# temperature, Wi-Fi signal and uptime to Warblet, and its little orange LED
# follows the commands "led:on" and "led:off" from your Warblet dashboard.
#
# Put your Wi-Fi and your Warblet setup code in secrets.yaml:
#   wifi_ssid: "your Wi-Fi name"
#   wifi_password: "your Wi-Fi password"
#   warblet_<your-board-id>: "your setup code"
# and replace <your-board-id> below with the id the setup page gives you.

esphome:
  name: xiao-s3

esp32:
  board: seeed_xiao_esp32s3

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

sensor:
  - platform: internal_temperature
    name: Chip temperature

switch:
  - platform: gpio
    id: led
    name: LED
    pin:
      number: GPIO21                  # the XIAO's user LED
      inverted: true                  # it lights when the pin is low

packages:
  warblet:
    url: https://github.com/Robota-LLC/Warblet-IoT
    ref: v1.5.0
    files:
      - path: esphome/warblet.yaml
        vars:
          id: <your-board-id>
          code: !secret warblet_<your-board-id>
      - path: esphome/warblet-commands.yaml
        vars:
          id: <your-board-id>
          code: !secret warblet_<your-board-id>

text_sensor:
  - id: !extend warblet_command       # what each command does
    on_value:
      - if:
          condition:
            lambda: return x == "led:on";
          then:
            - switch.turn_on: led
      - if:
          condition:
            lambda: return x == "led:off";
          then:
            - switch.turn_off: led
