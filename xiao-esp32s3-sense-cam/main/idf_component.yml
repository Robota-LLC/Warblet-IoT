## It brings Espressif's esp_jpeg with it, a JPEG decoder this image does not
## link. Pinned exactly, not floated — a demo that builds differently next
## month is the same rot the guard next door exists to catch.
dependencies:
  idf:
    version: ">=5.5"
  espressif/esp32-camera:
    version: "==2.1.8"
